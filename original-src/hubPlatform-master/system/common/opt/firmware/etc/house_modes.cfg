         {
            "deviceGroups":"A list of device groups that sets a list of life-safety devices"
         },
         {
            "excludedCategories":"default categories to use if life-safety groups aren't set"
         },
         {
            "why":"life-safety devices is a separate category of devices, that have different rules for security events handling. If a device belongs to the class of devices, the behavior is changed for abort window, different error codes are sent to cloud, etc"
